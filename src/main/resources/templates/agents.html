<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent 配置 - Agent Eval Lite</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
    <script src="/js/utils.js?v=20260723"></script>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <a href="/" class="navbar-brand">
            <span class="brand-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                    <rect x="3" y="7" width="18" height="13" rx="3"/>
                    <path d="M8 7V4a2 2 0 012-2h4a2 2 0 012 2v3"/>
                    <circle cx="9" cy="13" r="1.2" fill="currentColor"/>
                    <circle cx="15" cy="13" r="1.2" fill="currentColor"/>
                    <path d="M9 17h6"/>
                </svg>
            </span>
            <span class="brand-text">Agent Eval Lite</span>
        </a>
        <div class="navbar-links" id="nav-links">
            <a href="/" class="navbar-link">
                <svg class="link-icon" viewBox="0 0 20 20" fill="currentColor"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/></svg>
                首页
            </a>
            <a href="/manage" class="navbar-link">
                <svg class="link-icon" viewBox="0 0 20 20" fill="currentColor"><path d="M2 10a8 8 0 1116 0 8 8 0 01-16 0zm8-6a.75.75 0 01.75.75v4.5l2.5 1.5a.75.75 0 11-.75 1.3l-2.75-1.65a.75.75 0 01-.5-.65V4.75A.75.75 0 0110 4z"/></svg>
                管理
            </a>
            <a href="/agents" class="navbar-link active">
                <svg class="link-icon" viewBox="0 0 20 20" fill="currentColor"><path d="M7 3a1 1 0 000 2h6a1 1 0 100-2H7zM4 7a3 3 0 013-3h6a3 3 0 013 3v4a3 3 0 01-3 3H7a3 3 0 01-3-3V7z"/><path d="M9 12a1 1 0 100-2 1 1 0 000 2zm4 0a1 1 0 100-2 1 1 0 000 2z"/></svg>
                Agent
            </a>
        </div>
        <div class="navbar-actions">
            <button class="theme-toggle" onclick="toggleTheme()" title="切换主题" id="theme-btn">🌙</button>
            <button class="navbar-menu-btn" onclick="toggleNavMenu()" aria-label="菜单">
                <svg viewBox="0 0 20 20" fill="currentColor" width="18" height="18"><path d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z"/></svg>
            </button>
        </div>
    </nav>

    <div class="container">
        <!-- 页面头部 -->
        <div class="agents-page-header">
            <div class="agents-page-title">
                <h2>Agent 配置</h2>
                <span class="agents-count" id="agent-count-badge"></span>
            </div>
            <p class="agents-page-desc">管理你的 Agent 接入配置，支持快速测试和批量导入导出</p>
        </div>

        <!-- 工具栏 -->
        <div class="agents-toolbar">
            <div class="agents-search-wrap">
                <svg class="search-icon" viewBox="0 0 20 20" fill="currentColor" width="16" height="16"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/></svg>
                <input type="text" id="agent-search" class="agents-search-input" placeholder="搜索名称、端点..."
                       oninput="handleSearch(this.value)"
                       onkeydown="if(event.key==='Escape'){clearSearch();this.blur();}">
            </div>
            <div class="agents-toolbar-actions">
                <button class="btn btn-primary" onclick="openCreateModal()">+ 新建</button>
                <button class="btn btn-secondary" onclick="openTemplateModal()" title="从模板创建">模板</button>
                <span class="toolbar-divider"></span>
                <button class="btn btn-icon" onclick="exportAgents()" title="导出 JSON">
                    <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16"><path d="M13 8V2H7v6H2l8 8 8-8h-5z"/><path d="M0 18h20v2H0v-2z"/></svg>
                </button>
                <button class="btn btn-icon" onclick="triggerImport()" title="导入 JSON">
                    <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16"><path d="M7 12v6h6v-6h5l-8-8-8 8h5z"/><path d="M0 0h20v2H0V0z"/></svg>
                </button>
            </div>
        </div>

        <!-- 类型筛选 -->
        <div class="filter-chips" id="filter-chips"></div>

        <!-- Agent 列表 -->
        <div class="agents-table-wrap" id="agents-list">
            <div class="list-loading"><div class="spinner"></div><span>加载中...</span></div>
        </div>
    </div>

    <!-- 模板选择弹窗 -->
    <div id="template-modal" class="modal" style="display:none;">
        <div class="modal-panel">
            <div class="modal-header">
                <h3>📦 选择模板</h3>
                <button class="modal-close-btn" onclick="closeTemplateModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="template-list" id="template-list">
                    <div class="list-loading"><div class="spinner"></div></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 创建 / 编辑 Agent 弹窗 -->
    <div id="agent-modal" class="modal" style="display:none;">
        <div class="modal-panel modal-panel-wide">
            <div class="modal-header">
                <h3 id="modal-title">新建 Agent</h3>
                <button class="modal-close-btn" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-body">
                <form id="agent-form" onsubmit="handleSubmit(event)">
                    <input type="hidden" id="agent-id">

                    <div class="form-section">
                        <div class="form-row-2">
                            <div class="form-group">
                                <label class="form-label">名称 <span class="required">*</span></label>
                                <input type="text" id="agent-name" class="form-input" placeholder="例如：我的 GPT-4 Agent" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">类型</label>
                                <select id="agent-type" class="form-select" onchange="onTypeChange()">
                                    <option value="openai">🟢 OpenAI</option>
                                    <option value="claude">🟠 Claude</option>
                                    <option value="http">🔵 HTTP</option>
                                    <option value="custom">⚪ 自定义</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">描述</label>
                            <input type="text" id="agent-description" class="form-input" placeholder="选填备注">
                        </div>
                    </div>

                    <div class="form-section">
                        <div class="form-row-2">
                            <div class="form-group">
                                <label class="form-label">接口地址 <span class="required">*</span></label>
                                <input type="text" id="agent-endpoint" class="form-input" placeholder="https://api.openai.com/v1/chat/completions" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">超时(ms)</label>
                                <input type="number" id="agent-timeout" class="form-input" value="30000" min="1000" max="300000">
                            </div>
                        </div>

                        <div id="type-simple">
                            <div class="form-row-2">
                                <div class="form-group">
                                    <label class="form-label">API Key <span class="required">*</span></label>
                                    <input type="password" id="agent-api-key" class="form-input" placeholder="sk-...">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">模型</label>
                                    <input type="text" id="agent-model" class="form-input" placeholder="gpt-3.5-turbo">
                                </div>
                            </div>
                        </div>

                        <div id="type-advanced" style="display:none;">
                            <div class="form-group">
                                <label class="form-label">请求头 (JSON)</label>
                                <textarea id="agent-headers" class="form-textarea code" rows="2"
                                          placeholder='{"Content-Type": "application/json"}'></textarea>
                            </div>
                            <div class="form-group">
                                <label class="form-label">请求模板 <span class="field-hint">${input} = 用户输入</span></label>
                                <textarea id="agent-request-template" class="form-textarea code" rows="2"
                                          placeholder='{"messages":[{"role":"user","content":"${input}"}]}'></textarea>
                            </div>
                            <div class="form-group">
                                <label class="form-label">静态配置 (JSON)</label>
                                <textarea id="agent-config" class="form-textarea code" rows="2"
                                          placeholder='{"model":"gpt-3.5-turbo","temperature":0.7}'></textarea>
                            </div>
                            <div class="form-row-3">
                                <div class="form-group">
                                    <label class="form-label">输出路径</label>
                                    <input type="text" id="agent-output-path" class="form-input" placeholder="choices[0].message.content">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">错误路径</label>
                                    <input type="text" id="agent-error-path" class="form-input" placeholder="error">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">错误消息路径</label>
                                    <input type="text" id="agent-error-msg-path" class="form-input" placeholder="error.message">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-footer">
                        <button type="button" class="btn btn-ghost" onclick="runQuickTest()">🧪 测试</button>
                        <div class="form-footer-right">
                            <button type="button" class="btn btn-secondary" onclick="closeModal()">取消</button>
                            <button type="submit" id="save-btn" class="btn btn-primary">保存</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 快速测试弹窗 -->
    <div id="test-modal" class="modal" style="display:none;">
        <div class="modal-panel">
            <div class="modal-header">
                <h3 id="test-modal-title">🧪 测试</h3>
                <button class="modal-close-btn" onclick="closeTestModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="test-context" id="test-context"></div>
                <div class="form-group">
                    <input type="text" id="test-input" class="form-input" placeholder="输入测试内容" value="你好，请介绍一下你自己" onkeydown="if(event.key==='Enter')runTest()">
                </div>
                <div id="test-result" class="test-result-area"></div>
                <div class="form-footer" style="border-top:none;margin-top:12px;">
                    <div></div>
                    <div class="form-footer-right">
                        <button class="btn btn-secondary" onclick="closeTestModal()">关闭</button>
                        <button class="btn btn-primary" onclick="runTest()">发送</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 隐藏文件导入 -->
    <input type="file" id="import-file" accept=".json" style="display:none" onchange="handleImportFile(event)">

    <script src="/js/agents.js?v=202607302000"></script>
</body>
</html>

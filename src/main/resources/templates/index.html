<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Eval Lite - 控制台</title>
    <link rel="stylesheet" th:href="@{/css/app.css?v=20261010a}" />
</head>
<body>
    <div class="container">
        <!-- 导航栏 -->
        <nav class="navbar">
            <a href="/" class="navbar-brand">
                <span class="brand-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                        <rect x="3" y="7" width="18" height="13" rx="3"/>
                        <path d="M8 7V4a2 2 0 012-2h4a2 2 0 012 2v3"/>
                        <circle cx="9" cy="13" r="1.2" fill="currentColor"/>
                        <circle cx="15" cy="13" r="1.2" fill="currentColor"/>
                        <path d="M9 17h6"/>
                    </svg>
                </span>
                <span class="brand-text">Agent Eval Lite</span>
            </a>
            <div class="navbar-links" id="nav-links">
                <a href="/" class="navbar-link active">
                    <svg class="link-icon" viewBox="0 0 20 20" fill="currentColor"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/></svg>
                    首页
                </a>
                <a href="/manage" class="navbar-link">
                    <svg class="link-icon" viewBox="0 0 20 20" fill="currentColor"><path d="M2 10a8 8 0 1116 0 8 8 0 01-16 0zm8-6a.75.75 0 01.75.75v4.5l2.5 1.5a.75.75 0 11-.75 1.3l-2.75-1.65a.75.75 0 01-.5-.65V4.75A.75.75 0 0110 4z"/></svg>
                    管理
                </a>
                <a href="/agents" class="navbar-link">
                    <svg class="link-icon" viewBox="0 0 20 20" fill="currentColor"><path d="M7 3a1 1 0 000 2h6a1 1 0 100-2H7zM4 7a3 3 0 013-3h6a3 3 0 013 3v4a3 3 0 01-3 3H7a3 3 0 01-3-3V7z"/><path d="M9 12a1 1 0 100-2 1 1 0 000 2zm4 0a1 1 0 100-2 1 1 0 000 2z"/></svg>
                    Agent
                </a>
                <a href="/eval-config" class="navbar-link">
                    <svg class="link-icon" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.088 2.048-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.378 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/></svg>
                    评测配置
                </a>
                <a href="/eval-llm-config" class="navbar-link">
                    <svg class="link-icon" viewBox="0 0 20 20" fill="currentColor"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                    评测模型
                </a>
            
            <div class="navbar-actions">
                <button class="theme-toggle" onclick="toggleTheme()" title="切换主题" id="theme-btn">🌙</button>
                <button class="navbar-menu-btn" onclick="toggleNavMenu()" aria-label="菜单">
                    <svg viewBox="0 0 20 20" fill="currentColor" width="18" height="18"><path d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z"/></svg>
                </button>
            </div>
        </nav>

        <!-- 数据概览 -->
        <div class="dashboard-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-icon">📊</div>
                <div class="stat-value" id="totalTestCases" th:text="${totalTestCases != null ? totalTestCases : '-'}">-</div>
                <div class="stat-label">测试用例总数</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📋</div>
                <div class="stat-value" id="totalReports" th:text="${totalReports != null ? totalReports : '-'}">-</div>
                <div class="stat-label">评测报告总数</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">✅</div>
                <div class="stat-value" id="avgPassRate" th:text="${avgPassRateText != null ? avgPassRateText : '-'}">-</div>
                <div class="stat-label">平均通过率</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⚡</div>
                <div class="stat-value" id="avgResponseTime" th:text="${avgResponseTimeText != null ? avgResponseTimeText : '-'}">-</div>
                <div class="stat-label">平均响应时间</div>
            </div>
        </div>

        <!-- 快速操作 -->
        <h2 class="u-font-size-18px u-font-weight-600 u-margin-bottom-16px u-color-var-text-primary">快速操作</h2>
        <div class="quick-actions">
            <a href="/manage" class="action-card">
                <span class="action-icon">📝</span>
                <div class="action-title">管理用例</div>
                <div class="action-desc">创建、编辑、导入测试用例</div>
            </a>
            <a href="/manage#eval-tab" class="action-card">
                <span class="action-icon">🚀</span>
                <div class="action-title">开始评测</div>
                <div class="action-desc">选择用例并执行评测</div>
            </a>
            <a href="/manage#history-tab" class="action-card">
                <span class="action-icon">📈</span>
                <div class="action-title">查看报告</div>
                <div class="action-desc">浏览历史评测结果</div>
            </a>
            <a href="/agents" class="action-card">
                <span class="action-icon">🤖</span>
                <div class="action-title">配置 Agent</div>
                <div class="action-desc">管理 Agent 接口配置</div>
            </a>
        </div>

        <!-- 最近评测历史 -->
        <div class="recent-reports">
            <div class="section-header">
                <h2 class="section-title">最近评测记录</h2>
                <a href="/manage#history-tab" class="view-all-link">查看全部 →</a>
            </div>
            <div id="recentReportsContent">
                <div class="empty-state">
                    <div class="empty-state-icon">📭</div>
                    <p>暂无评测记录</p>
                </div>
            </div>
        </div>

        <!-- 系统状态 -->
        <div class="system-status">
            <h2 class="section-title u-margin-bottom-16px">系统状态</h2>
            <div id="systemStatusContent">
                <!-- 动态加载 -->
            </div>
        </div>
    </div>

    <script th:src="@{/js/utils.js?v=20261007a}"></script>
    <script th:src="@{/js/index.js?v=20261007a}"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Eval Lite - 控制台</title>
    <link rel="stylesheet" th:href="@{/css/app.css?v=20260809a}" />
    <style>
        /* 首页专用样式 */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            border: 1px solid var(--border-color);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        }

        .stat-card .stat-icon {
            font-size: 32px;
            margin-bottom: 12px;
        }

        .stat-card .stat-value {
            font-size: 36px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 8px;
        }

        .stat-card .stat-label {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .stat-card .stat-trend {
            font-size: 12px;
            margin-top: 8px;
        }

        .stat-trend.up { color: #10b981; }
        .stat-trend.down { color: #ef4444; }

        /* 快速操作卡片 */
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }

        .action-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .action-card:hover {
            border-color: var(--primary-color);
            background: var(--primary-color);
            color: white;
        }

        .action-card:hover .action-icon,
        .action-card:hover .action-title,
        .action-card:hover .action-desc {
            color: white;
        }

        .action-icon {
            font-size: 40px;
            margin-bottom: 12px;
            display: block;
        }

        .action-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .action-desc {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* 最近评测历史 */
        .recent-reports {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .view-all-link {
            font-size: 14px;
            color: var(--primary-color);
            text-decoration: none;
        }

        .view-all-link:hover {
            text-decoration: underline;
        }

        .report-table {
            width: 100%;
            border-collapse: collapse;
        }

        .report-table th {
            text-align: left;
            padding: 12px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            border-bottom: 2px solid var(--border-color);
        }

        .report-table td {
            padding: 12px;
            font-size: 14px;
            border-bottom: 1px solid var(--border-color);
        }

        .report-table tr:hover {
            background: var(--hover-bg);
        }

        .report-table .badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-success { background: #d1fae5; color: #065f46; }
        .badge-danger { background: #fee2e2; color: #991b1b; }
        .badge-info { background: #dbeafe; color: #1e40af; }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        /* 系统状态卡片 */
        .system-status {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            border: 1px solid var(--border-color);
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .status-item:last-child {
            border-bottom: none;
        }

        .status-label {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .status-value {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-indicator.healthy { background: #10b981; }
        .status-indicator.warning { background: #f59e0b; }
        .status-indicator.error { background: #ef4444; }

        /* 响应式 */
        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .quick-actions {
                grid-template-columns: repeat(2, 1fr);
            }

            .report-table {
                font-size: 12px;
            }

            .report-table th:nth-child(3),
            .report-table td:nth-child(3),
            .report-table th:nth-child(4),
            .report-table td:nth-child(4) {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 导航栏 -->
        <nav class="navbar">
            <a href="/" class="navbar-brand">
                <span class="brand-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                        <rect x="3" y="7" width="18" height="13" rx="3"/>
                        <path d="M8 7V4a2 2 0 012-2h4a2 2 0 012 2v3"/>
                        <circle cx="9" cy="13" r="1.2" fill="currentColor"/>
                        <circle cx="15" cy="13" r="1.2" fill="currentColor"/>
                        <path d="M9 17h6"/>
                    </svg>
                </span>
                <span class="brand-text">Agent Eval Lite</span>
            </a>
            <div class="navbar-links" id="nav-links">
                <a href="/" class="navbar-link active">
                    <svg class="link-icon" viewBox="0 0 20 20" fill="currentColor"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/></svg>
                    首页
                </a>
                <a href="/manage" class="navbar-link">
                    <svg class="link-icon" viewBox="0 0 20 20" fill="currentColor"><path d="M2 10a8 8 0 1116 0 8 8 0 01-16 0zm8-6a.75.75 0 01.75.75v4.5l2.5 1.5a.75.75 0 11-.75 1.3l-2.75-1.65a.75.75 0 01-.5-.65V4.75A.75.75 0 0110 4z"/></svg>
                    管理
                </a>
                <a href="/agents" class="navbar-link">
                    <svg class="link-icon" viewBox="0 0 20 20" fill="currentColor"><path d="M7 3a1 1 0 000 2h6a1 1 0 100-2H7zM4 7a3 3 0 013-3h6a3 3 0 013 3v4a3 3 0 01-3 3H7a3 3 0 01-3-3V7z"/><path d="M9 12a1 1 0 100-2 1 1 0 000 2zm4 0a1 1 0 100-2 1 1 0 000 2z"/></svg>
                    Agent
                </a>
                <a href="/eval-config" class="navbar-link">
                    <svg class="link-icon" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.088 2.048-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.378 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/></svg>
                    评测配置
                </a>
                <a href="/eval-llm-config" class="navbar-link">
                    <svg class="link-icon" viewBox="0 0 20 20" fill="currentColor"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                    评测模型
                </a>
            
            <div class="navbar-actions">
                <button class="theme-toggle" onclick="toggleTheme()" title="切换主题" id="theme-btn">🌙</button>
                <button class="navbar-menu-btn" onclick="toggleNavMenu()" aria-label="菜单">
                    <svg viewBox="0 0 20 20" fill="currentColor" width="18" height="18"><path d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z"/></svg>
                </button>
            </div>
        </nav>

        <!-- 数据概览 -->
        <div class="dashboard-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-icon">📊</div>
                <div class="stat-value" id="totalTestCases" th:text="${totalTestCases != null ? totalTestCases : '-'}">-</div>
                <div class="stat-label">测试用例总数</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📋</div>
                <div class="stat-value" id="totalReports" th:text="${totalReports != null ? totalReports : '-'}">-</div>
                <div class="stat-label">评测报告总数</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">✅</div>
                <div class="stat-value" id="avgPassRate" th:text="${avgPassRateText != null ? avgPassRateText : '-'}">-</div>
                <div class="stat-label">平均通过率</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⚡</div>
                <div class="stat-value" id="avgResponseTime" th:text="${avgResponseTimeText != null ? avgResponseTimeText : '-'}">-</div>
                <div class="stat-label">平均响应时间</div>
            </div>
        </div>

        <!-- 快速操作 -->
        <h2 style="font-size: 18px; font-weight: 600; margin-bottom: 16px; color: var(--text-primary);">快速操作</h2>
        <div class="quick-actions">
            <a href="/manage" class="action-card">
                <span class="action-icon">📝</span>
                <div class="action-title">管理用例</div>
                <div class="action-desc">创建、编辑、导入测试用例</div>
            </a>
            <a href="/manage#eval-tab" class="action-card">
                <span class="action-icon">🚀</span>
                <div class="action-title">开始评测</div>
                <div class="action-desc">选择用例并执行评测</div>
            </a>
            <a href="/manage#history-tab" class="action-card">
                <span class="action-icon">📈</span>
                <div class="action-title">查看报告</div>
                <div class="action-desc">浏览历史评测结果</div>
            </a>
            <a href="/agents" class="action-card">
                <span class="action-icon">🤖</span>
                <div class="action-title">配置 Agent</div>
                <div class="action-desc">管理 Agent 接口配置</div>
            </a>
        </div>

        <!-- 最近评测历史 -->
        <div class="recent-reports">
            <div class="section-header">
                <h2 class="section-title">最近评测记录</h2>
                <a href="/manage#history-tab" class="view-all-link">查看全部 →</a>
            </div>
            <div id="recentReportsContent">
                <div class="empty-state">
                    <div class="empty-state-icon">📭</div>
                    <p>暂无评测记录</p>
                </div>
            </div>
        </div>

        <!-- 系统状态 -->
        <div class="system-status">
            <h2 class="section-title" style="margin-bottom: 16px;">系统状态</h2>
            <div id="systemStatusContent">
                <!-- 动态加载 -->
            </div>
        </div>
    </div>

    <script th:src="@{/js/utils.js?v=20260809a}"></script>
    <script>
        // 主题切换
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';

            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);

            document.getElementById('theme-btn').textContent = newTheme === 'dark' ? '☀️' : '🌙';
        }

        // 加载保存的主题
        function loadTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            document.getElementById('theme-btn').textContent = savedTheme === 'dark' ? '☀️' : '🌙';
        }

        // 加载统计数据
        async function loadStats() {
            try {
                const health = await utils.api.get('/api/health?_=' + Date.now());
                const reports = await utils.api.get('/api/reports?size=100&_=' + Date.now());

                document.getElementById('totalTestCases').textContent = health.testCases || 0;
                document.getElementById('totalReports').textContent = health.reports || 0;

                // 计算平均通过率和响应时间
                const reportList = reports.reports || [];
                if (reportList.length > 0) {
                    const avgPassRate = reportList.reduce((sum, r) => {
                        const rate = r.summary?.pass_rate || 0;
                        return sum + rate;
                    }, 0) / reportList.length;

                    const avgTime = reportList.reduce((sum, r) => {
                        const time = r.summary?.avg_response_time || 0;
                        return sum + time;
                    }, 0) / reportList.length;

                    document.getElementById('avgPassRate').textContent = avgPassRate.toFixed(1) + '%';
                    document.getElementById('avgResponseTime').textContent = avgTime.toFixed(0) + 'ms';
                } else {
                    document.getElementById('avgPassRate').textContent = '-';
                    document.getElementById('avgResponseTime').textContent = '-';
                }
            } catch (err) {
                utils.logError('加载统计数据失败:', err);
            }
        }

        // 加载最近评测历史
        async function loadRecentReports() {
            try {
                const data = await utils.api.get('/api/reports?size=5&sort=desc&_=' + Date.now());
                const reports = data.reports || [];

                const container = document.getElementById('recentReportsContent');

                if (reports.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">📭</div>
                            <p>暂无评测记录</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = `
                    <table class="report-table">
                        <thead>
                            <tr>
                                <th>报告ID</th>
                                <th>评测时间</th>
                                <th>通过率</th>
                                <th>分组</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${reports.map(r => `
                                <tr>
                                    <td><code>${utils.escapeHtml(r.id)}</code></td>
                                    <td>${r.timestamp ? new Date(r.timestamp).toLocaleString() : '-'}</td>
                                    <td>
                                        <span class="badge ${(r.summary?.pass_rate || 0) >= 70 ? 'badge-success' : 'badge-danger'}">
                                            ${(r.summary?.pass_rate || 0).toFixed(1)}%
                                        </span>
                                    </td>
                                    <td>${r.group ? utils.escapeHtml(r.group) : '-'}</td>
                                    <td>
                                        <a href="/manage#history-tab" class="view-all-link">查看详情</a>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } catch (err) {
                utils.logError('加载评测历史失败:', err);
            }
        }

        // 加载系统状态
        async function loadSystemStatus() {
            try {
                const health = await utils.api.get('/api/health');

                const container = document.getElementById('systemStatusContent');
                container.innerHTML = `
                    <div class="status-item">
                        <span class="status-label">服务状态</span>
                        <span class="status-value">
                            <span class="status-indicator ${health.status === 'UP' ? 'healthy' : 'error'}"></span>
                            ${health.status === 'UP' ? '运行正常' : '异常'}
                        </span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">版本</span>
                        <span class="status-value">${health.version || '-'}</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">运行时长</span>
                        <span class="status-value">${formatUptime(health.uptimeSeconds || 0)}</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">分组数量</span>
                        <span class="status-value">${health.groups || 0}</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">已配置 Agent</span>
                        <span class="status-value">${health.agents || 0}</span>
                    </div>
                `;
            } catch (err) {
                utils.logError('加载系统状态失败:', err);
            }
        }

        // 格式化运行时长
        function formatUptime(seconds) {
            if (seconds < 60) return `${seconds}秒`;
            if (seconds < 3600) return `${Math.floor(seconds / 60)}分钟`;
            if (seconds < 86400) return `${Math.floor(seconds / 3600)}小时`;
            return `${Math.floor(seconds / 86400)}天`;
        }

        // 页面加载
        window.onload = async function() {
            loadTheme();
            await Promise.all([
                loadStats(),
                loadRecentReports(),
                loadSystemStatus()
            ]);
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>评测报告 - Agent Eval Lite</title>
    <script>
        // Follow the same theme toggle used across the app (localStorage key shared).
        (function () {
            try {
                var t = localStorage.getItem('agent-eval-theme');
                if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
                else if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
            } catch (e) {}
        })();
    </script>
    <style>
        :root {
            --primary: #4f6ce8;
            --primary-2: #6b82f0;
            --text: #333;
            --text-muted: #666;
            --card-bg: #ffffff;
            --surface: #f8f9fa;
            --page-bg: linear-gradient(135deg, #4f6ce8 0%, #6b82f0 100%);
            --back-link: #4f6ce8;
        }

        [data-theme="dark"] {
            --primary: #6b82f0;
            --primary-2: #8b9cf5;
            --text: #e8eaf0;
            --text-muted: #9aa0b0;
            --card-bg: #1a1d29;
            --surface: #232735;
            --page-bg: linear-gradient(135deg, #1a1d29 0%, #2a2e3d 100%);
            --back-link: #8b9cf5;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --primary: #6b82f0;
                --primary-2: #8b9cf5;
                --text: #e8eaf0;
                --text-muted: #9aa0b0;
                --card-bg: #1a1d29;
                --surface: #232735;
                --page-bg: linear-gradient(135deg, #1a1d29 0%, #2a2e3d 100%);
                --back-link: #8b9cf5;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--page-bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }

        h1 {
            color: var(--text);
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .section-title {
            margin-bottom: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-box {
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-box.green { background: linear-gradient(135deg, #28a745, #20c997); }
        .stat-box.red { background: linear-gradient(135deg, #dc3545, #c82333); }

        .stat-value {
            font-size: 36px;
            font-weight: bold;
        }

        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge-lg {
            font-size: 18px;
            padding: 10px 25px;
        }

        .summary-badge-wrap {
            text-align: center;
            margin-bottom: 30px;
        }

        .badge-success { background: #28a745; color: white; }
        .badge-danger { background: #dc3545; color: white; }

        .eval-item {
            background: var(--surface);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .eval-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .eval-item-body {
            font-size: 13px;
            color: var(--text-muted);
        }

        .eval-item-body p {
            margin: 5px 0;
        }

        .empty-hint {
            color: var(--text-muted);
            text-align: center;
            padding: 20px;
        }

        .back-link {
            display: inline-block;
            color: var(--back-link);
            text-decoration: none;
            margin-top: 20px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .btn-pdf {
            display: inline-block;
            color: white;
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
        }

        .action-bar {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>📊 评测报告</h1>
            <p class="subtitle" th:text="${#dates.format(#dates.createNow(), 'yyyy-MM-dd HH:mm:ss')}">报告时间</p>

            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-value" th:text="${totalTestCases}">0</div>
                    <div class="stat-label">总用例数</div>
                </div>
                <div class="stat-box green">
                    <div class="stat-value" th:text="${passedTestCases}">0</div>
                    <div class="stat-label">通过数</div>
                </div>
                <div class="stat-box red">
                    <div class="stat-value" th:text="${failedTestCases}">0</div>
                    <div class="stat-label">失败数</div>
                </div>
            </div>

            <div th:if="${summary}" class="summary-badge-wrap">
                <span class="badge badge-lg" th:classappend="${summary.pass_rate >= 70 ? 'badge-success' : 'badge-danger'}">
                    通过率: <span th:text="${#numbers.formatDecimal(summary.pass_rate, 1, 1)}">0.0</span>%
                </span>
            </div>
        </div>

        <div class="card">
            <h2 class="section-title">📋 评测详情</h2>
            <div th:if="${evaluations}" th:each="ev, iter : ${evaluations}" class="eval-item">
                <div class="eval-item-header">
                    <strong>测试用例 #<span th:text="${iter.index + 1}">1</span></strong>
                    <span class="badge" th:classappend="${ev.passed ? 'badge-success' : 'badge-danger'}"
                          th:text="${ev.passed ? '✅ 通过' : '❌ 失败'}">状态</span>
                </div>
                <div class="eval-item-body">
                    <p><strong>用例ID:</strong> <span th:text="${ev.testCaseId ?: '-'}">-</span></p>
                    <p><strong>Agent 输出:</strong> <span th:text="${ev.agentOutputText ?: '-'}">-</span></p>
                    <p><strong>评分:</strong> <span th:text="${#numbers.formatDecimal((ev.overallScore ?: 0) * 100, 1, 0)}">0</span>%</p>
                </div>
            </div>
            <div th:unless="${evaluations}" class="empty-hint">
                暂无详细数据
            </div>
        </div>

        <div class="action-bar">
            <a href="/" class="back-link">← 返回首页</a>
            <a th:href="@{'/api/reports/' + ${reportId} + '/export/pdf'}"
               class="btn-pdf" target="_blank">📄 下载 PDF 报告</a>
        </div>
    </div>
</body>
</html>
